<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8,#fff0f7);
}

/* Floating Hearts */

.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.heart{
    position:absolute;
    bottom:-40px;
    animation:float linear infinite;
    opacity:.8;
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    20%{opacity:1;}
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}
