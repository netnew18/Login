<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Want To Come Here?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8,#ffeaf3);
}

/* Floating Hearts */

.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.heart{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    animation:float linear infinite;
    opacity:.8;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Card */

.card{
    width:370px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    color:#ff2e7e;
    margin-bottom:30px;
    font-size:28px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    position:relative;
    height:70px;
}

button{
    width:120px;
    height:50px;
    border:none;
    border-radius:30px;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#ff4f93;
    position:absolute;
    left:20px;
}

#no{
    background:#7a7a7a;
    position:absolute;
    right:20px;
}

button:hover{
    transform:scale(1.08);
}
</style>
</head>

<body>

<div class="hearts"></div>

<div class="card">
    <h1>💖 Do you want to come here? 💖</h1>

    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
</div>

<script>

// Floating Hearts

const hearts=document.querySelector(".hearts");

setInterval(()=>{

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML=Math.random()>0.5?"💖":"💕";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    heart.style.animationDuration=(5+Math.random()*5)+"s";

    hearts.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);

},250);


// YES button runs away

const yes=document.getElementById("yes");

document.addEventListener("mousemove",(e)=>{

    const rect=yes.getBoundingClientRect();

    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height/2;

    const dx=e.clientX-x;
    const dy=e.clientY-y;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance<50){

        const angle=Math.atan2(dy,dx);

        const moveDistance = 80; // about 1 inch

let newX = rect.left - Math.cos(angle) * moveDistance;
let newY = rect.top - Math.sin(angle) * moveDistance;

        newX=Math.max(0,Math.min(window.innerWidth-rect.width,newX));
        newY=Math.max(0,Math.min(window.innerHeight-rect.height,newY));

        yes.style.left=newX+"px";
        yes.style.top=newY+"px";
    }

});

document.getElementById("no").onclick=()=>{

    alert("Aww 🥺 Maybe next time.");

};

</script>

</body>
</html>
