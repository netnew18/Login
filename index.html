<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Want To Come Here?</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8,#fff2f8);
}

/* Floating Hearts */

.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.heart{
    position:absolute;
    bottom:-120px;
    opacity:.85;
    animation:float linear infinite;
}

@keyframes float{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-130vh) rotate(360deg);
        opacity:0;
    }

}

/* Card */

.card{

    width:850px;
    padding:45px;

    border-radius:25px;

    background:rgba(255,255,255,.35);

    backdrop-filter:blur(15px);

    box-shadow:0 20px 40px rgba(0,0,0,.18);

    text-align:center;

}

h1{

    font-size:44px;
    color:#ff2d7a;
    line-height:1.3;
    margin-bottom:15px;
    text-shadow:0 4px 12px rgba(255,0,120,.25);

}

.subtitle{

    font-size:22px;
    color:#ff4f93;
    margin-bottom:40px;

}

.buttons{

    position:relative;
    height:90px;

}

button{

    width:140px;
    height:55px;

    border:none;

    border-radius:40px;

    font-size:20px;

    color:white;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    transform:scale(1.08);

}

#yes{

    position:fixed;
    left:43%;
    top:58%;
    transform:translate(-50%,-50%);
    background:#ff4f93;

}

#no{

    background:#666;

}

</style>

</head>

<body>

<div class="hearts"></div>

<div class="card">

<h1>💖 Ililibre mo ba ako ng kwekkwek mamaya? 💖</h1>

<p class="subtitle">
10pcs lang 💕
</p>

<div class="buttons">

<button id="no">Sigeee</button>

</div>

</div>

<button id="yes">No</button>

<script>

/* Floating Hearts */

const hearts=document.querySelector(".hearts");

setInterval(()=>{

    const h=document.createElement("div");

    h.className="heart";

    h.innerHTML=Math.random()>0.5?"🍔":"🍢";

    h.style.left=Math.random()*100+"vw";

    h.style.fontSize=(50+Math.random()*50)+"px";

    h.style.animationDuration=(8+Math.random()*8)+"s";

    hearts.appendChild(h);

    setTimeout(()=>{

        h.remove();

    },17000);

},120);


/* YES Button */

const yes=document.getElementById("yes");

function moveButton(){

    const rect=yes.getBoundingClientRect();

    const padding=15;

    const maxX=window.innerWidth-rect.width-padding;

    const maxY=window.innerHeight-rect.height-padding;

    const x=Math.random()*maxX;

    const y=Math.random()*maxY;

    yes.style.left=x+"px";
    yes.style.top=y+"px";
    yes.style.transform="none";

}

document.addEventListener("mousemove",(e)=>{

    const rect=yes.getBoundingClientRect();

    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;

    const dx=e.clientX-centerX;
    const dy=e.clientY-centerY;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance<140){

        moveButton();

    }

});

/* Mobile */

document.addEventListener("touchstart",()=>{

    moveButton();

});


document.getElementById("no").onclick=function(){

    alert("😂 Sigeee sabi mo yan! Salamaaat! 😂");

};

</script>

</body>
</html>
